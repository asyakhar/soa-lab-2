plugins {
    id 'java'
    id 'war'
    id 'io.swagger.core.v3.swagger-gradle-plugin' version '2.2.25'
}

group = 'ru.ifmo.soa'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs.add('-parameters')
}

repositories {
    mavenCentral()
}

configurations {
    openApiRuntime
}

dependencies {
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:10.0.0'

    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.25'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    compileOnly 'io.swagger.core.v3:swagger-core-jakarta:2.2.25'

    openApiRuntime 'io.swagger.core.v3:swagger-jaxrs2-jakarta:2.2.25'
    openApiRuntime 'jakarta.platform:jakarta.jakartaee-api:10.0.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/gen/java']
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('war') {
    archiveFileName = 'booking.war'
}

resolve {
    outputFileName = 'booking-service.generated'
    outputFormat = 'JSON'
    prettyPrint = 'TRUE'
    sortOutput = false
    classpath = sourceSets.main.runtimeClasspath + configurations.openApiRuntime
    resourcePackages = ['ru.ifmo.soa.booking']
    filterClass = 'ru.ifmo.soa.booking.config.BookingOpenApiFilter'
    outputDir = file("$buildDir/openapi")
}

tasks.register('verifyOpenApiContract') {
    group = 'verification'
    description = 'Generates OpenAPI from JAX-RS code and compares its executable contract with the source specification.'
    dependsOn tasks.named('resolve')

    def sourceSpec = file('../specs/booking-service.openapi.json')
    def generatedSpec = file("$buildDir/openapi/booking-service.generated.json")
    def comparisonDir = file("$buildDir/openapi/comparison")

    inputs.file(sourceSpec)
    inputs.file(generatedSpec)
    outputs.dir(comparisonDir)

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def source = slurper.parse(sourceSpec)
        def generated = slurper.parse(generatedSpec)
        def ignoredKeys = ['example', 'examples'] as Set

        Closure resolveReference = { Map root, String reference ->
            reference.substring(2).split('/').inject(root) { current, token ->
                current[token.replace('~1', '/').replace('~0', '~')]
            }
        }

        Closure normalize
        normalize = { value, Map root ->
            if (value instanceof Map) {
                if (value.size() == 1 && value['$ref']?.startsWith('#/')) {
                    return normalize(resolveReference(root, value['$ref'] as String), root)
                }

                def normalized = new TreeMap()
                value.each { key, nested ->
                    if (!ignoredKeys.contains(key)) {
                        normalized[key] = normalize(nested, root)
                    }
                }
                return normalized
            }

            if (value instanceof List) {
                def normalized = value.collect { normalize(it, root) }
                return normalized.every { it instanceof String }
                    ? normalized.sort()
                    : normalized
            }

            if (value instanceof String) {
                return value.replaceAll('\\s+', ' ').trim()
            }

            return value
        }

        def sourceContract = normalize([
            openapi: source.openapi,
            info: source.info,
            servers: source.servers,
            tags: source.tags,
            paths: source.paths,
            schemas: source.components?.schemas
        ], source as Map)
        def generatedContract = normalize([
            openapi: generated.openapi,
            info: generated.info,
            servers: generated.servers,
            tags: generated.tags,
            paths: generated.paths,
            schemas: generated.components?.schemas
        ], generated as Map)

        comparisonDir.mkdirs()
        def sourceContractFile = new File(comparisonDir, 'source.contract.json')
        def generatedContractFile = new File(comparisonDir, 'generated.contract.json')
        sourceContractFile.text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson(sourceContract)
        )
        generatedContractFile.text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson(generatedContract)
        )

        if (sourceContract != generatedContract) {
            throw new GradleException(
                "OpenAPI contract differs from JAX-RS code. Compare ${sourceContractFile} and ${generatedContractFile}."
            )
        }

        logger.lifecycle("OpenAPI contract matches ${sourceSpec}.")
        logger.lifecycle('Verified: metadata, servers, tags, operations, responses and schemas.')
        logger.lifecycle("Generated specification: ${generatedSpec}")
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyOpenApiContract')
}
